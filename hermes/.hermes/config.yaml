database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
model:
  default: ollama-cloud/glm-5.3-flash
  provider: 9router
providers:
  9router:
    base_url: https://ai.workofekajaya.com/v1
    key_env: NINEROUTER_API_KEY
kanban:
  review_dispatch: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  protect_first_n: 3
  idle_compact_after_seconds: 0
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
streaming:
  enabled: false
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  personalities: {}
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
display:
  compact: false
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: true
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
plugins:
  enabled: []
_config_version: 38
onboarding:
  seen:
    openclaw_residue_cleanup: true
